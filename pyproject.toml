[project]
name = "ccarp"
version = "0.1.0"
description = "Drill tool for the Anthropic Claude Certified Architect - Professional exam"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ccarp = "ccarp.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ccarp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
