name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync
        run: uv sync --all-extras --dev

      - name: Lint
        run: uv run ruff check .

      - name: Tests
        run: uv run pytest -q

      # Structural errors only. Authoring quality is reported below, not gated here,
      # until lint lands and can back a --strict gate.
      - name: Validate blueprint and banks
        run: uv run ccarp validate

      # Informational: renders on the PR page so bank quality is visible before merge
      # rather than discoverable after it.
      - name: Bank report
        if: always()
        run: uv run ccarp report --markdown >> "$GITHUB_STEP_SUMMARY"
