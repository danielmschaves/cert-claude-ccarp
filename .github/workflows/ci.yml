name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync
        run: uv sync --all-extras --dev

      - name: Lint
        run: uv run ruff check .

      - name: Tests
        run: uv run pytest -q

      # --strict promotes authoring warnings to errors, so a bank that drifts into a
      # guessable answer key or a missing question stem fails the PR rather than the exam.
      - name: Validate blueprint and banks
        run: uv run ccarp validate --strict

      # Informational: renders on the PR page so bank quality is visible before merge
      # rather than discoverable after it.
      - name: Bank report
        if: always()
        run: uv run ccarp report --markdown >> "$GITHUB_STEP_SUMMARY"
